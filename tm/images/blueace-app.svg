<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Smartphone Frame -->
  <rect x="50" y="30" width="300" height="540" rx="36" fill="#0A1C30" stroke="#334155" stroke-width="8"/>
  <rect x="70" y="70" width="260" height="460" rx="20" fill="#0F2B48"/>
  <!-- App Notch -->
  <rect x="150" y="42" width="100" height="16" rx="8" fill="#1E293B"/>
  
  <!-- Blueace App UI Screen -->
  <text x="200" y="110" font-family="sans-serif" font-weight="bold" font-size="22" fill="#10B981" text-anchor="middle">BLUEACE HVAC</text>
  <text x="200" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Real-time Monitoring & AMC</text>
  
  <!-- Live Monitoring Card -->
  <rect x="90" y="150" width="220" height="90" rx="12" fill="#1E50A2"/>
  <text x="110" y="180" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Plant Room 01</text>
  <text x="110" y="200" font-family="sans-serif" font-size="12" fill="#A7F3D0">Status: Optimal Efficiency</text>
  <text x="110" y="220" font-family="sans-serif" font-weight="bold" font-size="16" fill="#10B981">COP: 6.2 (High)</text>

  <!-- Work Orders Card -->
  <rect x="90" y="260" width="220" height="80" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
  <text x="110" y="290" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff">Digital Work Order #4092</text>
  <text x="110" y="310" font-family="sans-serif" font-size="12" fill="#CBD5E1">AHU Filter Preventive Check</text>

  <!-- Breakdown Call Button -->
  <rect x="90" y="360" width="220" height="45" rx="10" fill="#10B981"/>
  <text x="200" y="388" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">+ 24x7 Breakdown Call</text>

  <!-- Play Store / App Store Badge Placeholders -->
  <rect x="90" y="420" width="105" height="35" rx="6" fill="#334155"/>
  <text x="142" y="442" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Google Play</text>

  <rect x="205" y="420" width="105" height="35" rx="6" fill="#334155"/>
  <text x="257" y="442" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">App Store</text>
</svg>
